<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إسأل | جاري التحديث</title>
    <script>
        (function () {
            var segs = window.location.pathname.split('/').filter(Boolean);
            var target = (window.location.hostname.endsWith('github.io') && segs.length > 0)
                ? '/' + segs[0] + '/'
                : '/';
            window.location.replace(target);
        })();
    </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 40px;">
    <p>جاري تحويلك إلى صفحة التحديث...</p>
    <a href="./">الضغط هنا للمتابعة</a>
</body>
</html>
